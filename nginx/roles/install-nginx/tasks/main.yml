- name: Install and configure nginx on RHEL (tasks/main.yml)
  include_tasks: nginx-redhat.yml
  when: ansible_facts['os_family']|lower == 'redhat'

- name: Install and configure nginx on Ubuntu (tasks/main.yml)
  include_tasks: nginx-ubuntu.yml
  when: ansible_facts['os_family']|lower == 'debian'

- name: Start and enable nginx service (tasks/main.yml)
  include_tasks: common.yml
