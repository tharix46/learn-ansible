- name: Uninstall nginx on Ubuntu (tasks/nginx-ubuntu.yml)
  ansible.builtin.apt:
    name: nginx
    state: absent
    autoremove: true
    purge: true

- name: Remove index.html (tasks/nginx-ubuntu.yml)
  ansible.builtin.file:
    path: /var/www/html/index.html
    state: absent

- name: Remove port 80 in ufw (tasks/nginx-ubuntu.yml)
  community.general.ufw:
    delete: true
    rule: allow
    port: "80"
    proto: tcp
