---
- name: install nginx on RHEL and Ubuntu
  hosts: all
  become: true

  tasks:
    - name: install nginx on rhel9
      ansible.builtin.dnf:
        name: nginx
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == "RedHat"

    - name: install nginx on ubuntu
      ansible.builtin.apt:
        name: nginx
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: copy index.html with owner and permissions (RHEL)
      ansible.builtin.copy:
        src: index.html
        dest: /usr/share/nginx/html/
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts['os_family'] == "RedHat"

    - name: copy index.html with owner and permissions (Ubuntu)
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/
        owner: root
        group: root
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"

    - name: allow http service in firewalld
      ansible.posix.firewalld:
        permanent: true
        immediate: true
        service: http
        state: enabled
      when: ansible_facts['os_family'] == "RedHat"
      notify: reload firewalld

    - name: allow port 80 in ufw
      community.general.ufw:
        state: enabled
        rule: allow
        port: "80"
        proto: tcp
      when: ansible_facts['os_family'] == "Debian"

  handlers:
    - name: reload firewalld
      ansible.builtin.command: firewall-cmd --reload
