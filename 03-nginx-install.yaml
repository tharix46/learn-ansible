---
- name: install nginx on rhel9
  hosts: rhel
  become: true

  tasks:
    - name: install nginx
      dnf:
        name: nginx
        state: latest
        update_cache: true

    - name: start and enable nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: copy file with owner and permissions
      copy:
        src: index.html
        dest: /usr/share/nginx/html/
        owner: root
        group: root
        mode: "0644"

    - name: allow http service in firewalld
      ansible.posix.firewalld:
        permanent: true
        immediate: true
        service: http
        state: enabled
      notify: reload firewalld

  handlers:
    - name: reload firewalld
      command: firewall-cmd --reload
